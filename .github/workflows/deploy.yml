name: Deploy Hugo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Stack theme
        run: |
          # 克隆 Stack 主题
          git clone --depth 1 https://github.com/CaiJimmy/hugo-theme-stack.git themes/hugo-theme-stack

          # 清理旧文件
          rm -rf config content i18n go.mod hugo.toml

          # 复制 demo 的配置
          mkdir -p config/_default
          cp themes/hugo-theme-stack/demo/config/_default/params.toml config/_default/
          cp themes/hugo-theme-stack/demo/config/_default/languages.toml config/_default/
          cp themes/hugo-theme-stack/demo/config/_default/markup.toml config/_default/
          cp themes/hugo-theme-stack/demo/config/_default/menu.toml config/_default/
          cp themes/hugo-theme-stack/demo/config/_default/related.toml config/_default/

          # 自己写最简 hugo.toml
          cat > config/_default/hugo.toml << 'ENDOFCONFIG'
          baseURL = "https://blog.ruusu.cn/"
          title = "bell"
          theme = "hugo-theme-stack"
          paginate = 10
          defaultContentLanguage = "en"
          hasCJKLanguage = true
          ENDOFCONFIG

          # 修改 params.toml：设置头像、作者名、描述
          sed -i 's|avatar = .*|avatar = "https://avatars.githubusercontent.com/u/98460303?v=4"|' config/_default/params.toml
          sed -i 's|author = .*|author = "bell"|' config/_default/params.toml
          sed -i 's|description = .*|description = "Ops Engineer"|' config/_default/params.toml

          # 复制 demo 的内容结构
          cp -r themes/hugo-theme-stack/demo/content content

          # 删掉所有演示文章，只保留页面结构
          rm -rf content/post/*
          rm -rf content/post/shortcodes

          # 创建第一篇博客
          cat > content/post/hello-world.md << 'ENDOFMD'
          ---
          title: "你好，世界"
          date: 2026-10-26
          draft: false
          tags: ["hello", "blog"]
          categories: ["随笔"]
          ---

          你好，世界。

          这是我的第一篇博客。我是 bell，一名运维工程师，日常和 Linux 服务器、网络、虚拟化与性能测试打交道。

          这个博客用来记录技术笔记、排障经验、压测心得，还有一些折腾机器的日常。

          技术栈：
          - Linux（RedHat / Rocky）
          - KVM 虚拟化
          - 服务器运维与性能测试
          - 交换机配置与网络调优

          以后会慢慢把踩过的坑都写在这里。
          ENDOFMD

          # 更新 about 页面
          cat > content/page/about/index.md << 'ENDOFMD'
          ---
          title: "About"
          description: "关于我"
          ---

          你好，我是 bell。

          一名运维工程师，日常和 Linux 服务器、网络、虚拟化与性能测试打交道。

          平时在部署、排障、压测和自动化之间来回切换。做点东西，也顺手记点东西。

          GitHub: https://github.com/Megumi-02
          ENDOFMD

          # 生成 CNAME
          echo 'blog.ruusu.cn' > CNAME

          echo "=== params.toml avatar ==="
          grep avatar config/_default/params.toml
          echo "=== posts ==="
          ls content/post/
          echo "=== pages ==="
          ls content/page/

      - name: Build
        run: hugo --minify 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
