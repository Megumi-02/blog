name: Deploy Hugo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Stack theme
        run: |
          # 克隆 Stack v4 主题
          git clone --depth 1 https://github.com/CaiJimmy/hugo-theme-stack.git themes/hugo-theme-stack

          # 清理旧文件
          rm -rf config content i18n go.mod hugo.toml

          # 创建最简配置，传统 theme 方式
          cat > hugo.toml << 'ENDOFCONFIG'
          baseURL = "https://blog.ruusu.cn/"
          title = "bell"
          theme = "hugo-theme-stack"
          paginate = 10
          defaultContentLanguage = "en"
          hasCJKLanguage = true

          [params]
            description = "bell's Blog"
            author = "bell"
          ENDOFCONFIG

          # 创建示例内容
          mkdir -p content/posts
          cat > content/posts/_index.md << 'ENDOFMD'
          ---
          title: "Posts"
          ---
          ENDOFMD

          cat > content/posts/hello-world.md << 'ENDOFMD'
          ---
          title: "Hello World"
          date: 2026-10-26
          draft: false
          ---

          欢迎来到我的博客！

          这是第一篇文章，使用 Hugo + Stack 主题构建。
          ENDOFMD

          mkdir -p content/about
          cat > content/about/_index.md << 'ENDOFMD'
          ---
          title: "About"
          ---

          你好，我是 bell，一名 Ops Engineer。

          这是我的个人博客，记录技术笔记和日常。
          ENDOFMD

          # 生成 CNAME
          echo 'blog.ruusu.cn' > CNAME

          echo "=== hugo.toml ==="
          cat hugo.toml
          echo "=== theme exists? ==="
          ls themes/hugo-theme-stack/ | head -5

      - name: Build
        run: hugo --minify 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
