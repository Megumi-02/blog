name: Deploy Hugo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Stack theme
        run: |
          git clone --depth 1 https://github.com/CaiJimmy/hugo-theme-stack.git themes/hugo-theme-stack
          mkdir -p config/_default
          cp themes/hugo-theme-stack/demo/config/_default/*.toml config/_default/
          rm -f hugo.toml
          # 把 demo 的 module 引用改成传统 theme 方式
          sed -i 's|\[\[module.imports\]\]|# [[module.imports]]|g' config/_default/hugo.toml
          echo 'theme = "hugo-theme-stack"' >> config/_default/hugo.toml
          # 改成用户的 baseURL
          sed -i 's|baseURL = .*|baseURL = "https://megumi-02.github.io/blog/"|' config/_default/hugo.toml
          sed -i 's|title = .*|title = "bell"|' config/_default/hugo.toml

      - name: Build
        run: hugo --minify 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
