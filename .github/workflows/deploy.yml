name: Deploy Hugo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup PaperMod theme
        run: |
          # 克隆 PaperMod 主题
          git clone --depth 1 https://github.com/adityatelange/hugo-PaperMod.git themes/PaperMod

          # 清理旧文件
          rm -rf config content i18n go.mod hugo.toml

          # 创建配置
          cat > hugo.toml << 'ENDOFCONFIG'
          baseURL = "https://blog.ruusu.cn/"
          title = "bell"
          theme = "PaperMod"
          paginate = 5

          [params]
            description = "bell's Blog"
            author = "bell"
            ShowToc = true
            ShowReadingTime = true
            ShowShareButtons = true
            ShowPostNavLinks = true
            ShowBreadCrumbs = true
            ShowCodeCopyButtons = true

          [menu]
            [[menu.main]]
              identifier = "home"
              name = "Home"
              url = "/"
              weight = 10
            [[menu.main]]
              identifier = "posts"
              name = "Posts"
              url = "/posts/"
              weight = 20
            [[menu.main]]
              identifier = "tags"
              name = "Tags"
              url = "/tags/"
              weight = 30
            [[menu.main]]
              identifier = "about"
              name = "About"
              url = "/about/"
              weight = 40
          ENDOFCONFIG

          # 创建示例内容
          mkdir -p content/posts
          cat > content/posts/_index.md << 'ENDOFMD'
          ---
          title: "Posts"
          ---
          ENDOFMD

          cat > content/posts/hello-world.md << 'ENDOFMD'
          ---
          title: "Hello World"
          date: 2026-10-26
          draft: false
          tags: ["hugo", "paperMod"]
          ---

          欢迎来到我的博客！

          这是第一篇文章，使用 Hugo + PaperMod 主题构建。
          ENDOFMD

          mkdir -p content/about
          cat > content/about/_index.md << 'ENDOFMD'
          ---
          title: "About"
          ---

          你好，我是 bell，一名 Ops Engineer。

          这是我的个人博客，记录技术笔记和日常。
          ENDOFMD

          # 生成 CNAME
          echo 'blog.ruusu.cn' > CNAME

          echo "=== hugo.toml ==="
          cat hugo.toml
          echo "=== content structure ==="
          find content -type f

      - name: Build
        run: hugo --minify 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
