name: Deploy Hugo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup project
        run: |
          # 清理旧文件
          rm -rf config content i18n go.mod hugo.toml themes

          # 初始化 Hugo 模块
          hugo mod init github.com/Megumi-02/blog

          # 写 hugo.toml，用 module 方式引入主题
          cat > hugo.toml << 'ENDOFCONFIG'
          baseURL = "https://blog.ruusu.cn/"
          title = "bell"
          paginate = 10
          hasCJKLanguage = true

          [module]
            [[module.imports]]
              path = "github.com/CaiJimmy/hugo-theme-stack/v4"
          ENDOFCONFIG

          # 下载主题模块
          hugo mod get github.com/CaiJimmy/hugo-theme-stack/v4

          # 创建内容目录
          mkdir -p content/post
          mkdir -p content/about
          mkdir -p content/archives
          mkdir -p content/links

          # 第一篇博客
          cat > content/post/hello-world.md << 'ENDOFMD'
          ---
          title: "你好，世界"
          date: 2026-10-26
          draft: false
          tags: ["随笔"]
          ---

          你好，世界。

          这是我的第一篇博客。我是 bell，一名运维工程师，日常和 Linux 服务器、网络、虚拟化与性能测试打交道。

          这个博客用来记录技术笔记、排障经验、压测心得，还有一些折腾机器的日常。

          技术方向：
          - Linux（RedHat / Rocky）
          - KVM 虚拟化
          - 服务器运维与性能测试
          - 交换机配置与网络调优

          以后会慢慢把踩过的坑都写在这里。
          ENDOFMD

          # 关于页面
          cat > content/about/_index.md << 'ENDOFMD'
          ---
          title: "关于我"
          description: "关于我"
          ---

          你好，我是 bell。

          一名运维工程师，日常和 Linux 服务器、网络、虚拟化与性能测试打交道。

          平时在部署、排障、压测和自动化之间来回切换。做点东西，也顺手记点东西。

          GitHub: https://github.com/Megumi-02
          ENDOFMD

          # 归档页面
          cat > content/archives/_index.md << 'ENDOFMD'
          ---
          title: "归档"
          ---
          ENDOFMD

          # 链接页面
          cat > content/links/_index.md << 'ENDOFMD'
          ---
          title: "链接"
          ---

          - [GitHub](https://github.com/Megumi-02)
          ENDOFMD

          # 生成 CNAME
          echo 'blog.ruusu.cn' > CNAME

          echo "=== hugo.toml ==="
          cat hugo.toml
          echo "=== go.mod ==="
          cat go.mod

      - name: Build
        run: hugo --minify 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
