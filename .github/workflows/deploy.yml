name: Deploy Hugo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Stack theme
        run: |
          git clone --depth 1 https://github.com/CaiJimmy/hugo-theme-stack.git themes/hugo-theme-stack
          mkdir -p config/_default
          cp themes/hugo-theme-stack/demo/config/_default/*.toml config/_default/
          rm -f hugo.toml
          # 用传统 theme 方式，不用 Hugo Modules
          sed -i '/\[\[module.imports\]\]/,/^$/d' config/_default/hugo.toml
          echo 'theme = "hugo-theme-stack"' >> config/_default/hugo.toml
          # 改成用户的配置
          sed -i 's|baseURL = .*|baseURL = "https://blog.ruusu.cn/"|' config/_default/hugo.toml
          sed -i 's|title = .*|title = "bell"|' config/_default/hugo.toml
          # 生成 CNAME 文件
          echo 'blog.ruusu.cn' > CNAME
          # 用 demo 的内容，先跑通
          rm -rf content i18n
          cp -r themes/hugo-theme-stack/demo/content content
          # 删掉 shortcodes 示例页（引用了不存在的短代码）
          rm -rf content/post/shortcodes
          echo "=== config files ==="
          ls config/_default/
          echo "=== content structure ==="
          find content -type f | head -20

      - name: Build
        run: hugo --minify 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
