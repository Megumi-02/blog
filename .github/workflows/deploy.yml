name: Deploy Hugo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Stack theme
        run: |
          # 克隆 Stack 主题
          git clone --depth 1 https://github.com/CaiJimmy/hugo-theme-stack.git themes/hugo-theme-stack

          # 清理旧文件
          rm -rf config content i18n go.mod hugo.toml

          # 复制 demo 的配置
          mkdir -p config/_default
          cp themes/hugo-theme-stack/demo/config/_default/params.toml config/_default/
          cp themes/hugo-theme-stack/demo/config/_default/languages.toml config/_default/
          cp themes/hugo-theme-stack/demo/config/_default/markup.toml config/_default/
          cp themes/hugo-theme-stack/demo/config/_default/menu.toml config/_default/
          cp themes/hugo-theme-stack/demo/config/_default/related.toml config/_default/

          # 写 hugo.toml，默认语言中文
          cat > config/_default/hugo.toml << 'ENDOFCONFIG'
          baseURL = "https://blog.ruusu.cn/"
          title = "bell"
          theme = "hugo-theme-stack"
          paginate = 10
          defaultContentLanguage = "zh"
          hasCJKLanguage = true
          ENDOFCONFIG

          # 修改 params.toml：头像、作者、简介
          sed -i 's|avatar = .*|avatar = "https://avatars.githubusercontent.com/u/98460303?v=4"|' config/_default/params.toml
          sed -i 's|author = .*|author = "bell"|' config/_default/params.toml
          sed -i 's|description = .*|description = "运维工程师 · 折腾机器的人"|' config/_default/params.toml

          # 修改 menu.toml：改成中文菜单
          cat > config/_default/menu.toml << 'ENDOFMENU'
          [[main]]
            identifier = "home"
            name = "首页"
            url = "/"
            weight = 10
          [[main]]
            identifier = "about"
            name = "关于"
            url = "/page/about/"
            weight = 20
          [[main]]
            identifier = "archives"
            name = "归档"
            url = "/page/archives/"
            weight = 30
          [[main]]
            identifier = "links"
            name = "链接"
            url = "/page/links/"
            weight = 40
          ENDOFMENU

          # 复制 demo 的内容结构
          cp -r themes/hugo-theme-stack/demo/content content

          # 删掉所有演示文章
          rm -rf content/post/*
          rm -rf content/post/shortcodes

          # 创建第一篇博客（中文）
          cat > content/post/hello-world.md << 'ENDOFMD'
          ---
          title: "你好，世界"
          date: 2026-10-26
          draft: false
          tags: ["随笔"]
          categories: ["随笔"]
          ---

          你好，世界。

          这是我的第一篇博客。我是 bell，一名运维工程师，日常和 Linux 服务器、网络、虚拟化与性能测试打交道。

          这个博客用来记录技术笔记、排障经验、压测心得，还有一些折腾机器的日常。

          技术方向：
          - Linux（RedHat / Rocky）
          - KVM 虚拟化
          - 服务器运维与性能测试
          - 交换机配置与网络调优

          以后会慢慢把踩过的坑都写在这里。
          ENDOFMD

          # 更新 about 页面（中文）
          cat > content/page/about/index.zh.md << 'ENDOFMD'
          ---
          title: "关于我"
          description: "关于我"
          ---

          你好，我是 bell。

          一名运维工程师，日常和 Linux 服务器、网络、虚拟化与性能测试打交道。

          平时在部署、排障、压测和自动化之间来回切换。做点东西，也顺手记点东西。

          GitHub: https://github.com/Megumi-02
          ENDOFMD

          # 生成 CNAME
          echo 'blog.ruusu.cn' > CNAME

          echo "=== hugo.toml ==="
          cat config/_default/hugo.toml
          echo "=== menu ==="
          cat config/_default/menu.toml

      - name: Build
        run: hugo --minify 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
