name: Deploy Hugo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Init Hugo modules
        run: |
          # 清理旧文件
          rm -rf themes content config i18n go.mod hugo.toml

          # 初始化 Hugo 模块
          hugo mod init github.com/Megumi-02/blog

          # 创建最简配置，引用 v4 主题
          cat > hugo.toml << 'EOF'
baseURL = "https://blog.ruusu.cn/"
title = "bell"
paginate = 10
defaultContentLanguage = "en"
hasCJKLanguage = true

[module]
  [[module.imports]]
    path = "github.com/CaiJimmy/hugo-theme-stack/v4"
EOF

          # 拉取主题模块
          hugo mod get github.com/CaiJimmy/hugo-theme-stack/v4

          # 用 v4 demo 的内容
          cp -r themes/github.com/!cai!jimmy/hugo-theme-stack/v4/demo/content content
          cp -r themes/github.com/!cai!jimmy/hugo-theme-stack/v4/demo/config config

          # 删掉 shortcodes 示例页
          rm -rf content/post/shortcodes

          # 生成 CNAME
          echo 'blog.ruusu.cn' > CNAME

          echo "=== project structure ==="
          ls -la
          echo "=== hugo version ==="
          hugo version
          echo "=== themes ==="
          find themes -maxdepth 3 -type d

      - name: Build
        run: hugo --minify 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
