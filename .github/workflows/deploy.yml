name: Deploy Hugo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup project
        run: |
          # 克隆主题
          git clone --depth 1 https://github.com/CaiJimmy/hugo-theme-stack.git themes/hugo-theme-stack

          # 清理旧文件
          rm -rf config content i18n go.mod hugo.toml archetypes data layouts static assets

          # 复制 demo 的全部文件
          cp -r themes/hugo-theme-stack/demo/* .

          # 删掉 go.mod 里的 replace 行（主题仓库内部用的，我们不需要）
          sed -i '/^replace/d' go.mod

          # 改 go.mod 的模块名
          sed -i 's|^module .*|module github.com/Megumi-02/blog|' go.mod

          # 删掉 shortcodes 示例页
          rm -rf content/post/shortcodes

          # 改 baseURL 和 title
          sed -i 's|baseURL = .*|baseURL = "https://blog.ruusu.cn/"|' config/_default/hugo.toml
          sed -i 's|title = .*|title = "bell"|' config/_default/hugo.toml

          # 生成 CNAME
          echo 'blog.ruusu.cn' > CNAME

          echo "=== go.mod ==="
          cat go.mod
          echo "=== config files ==="
          ls config/_default/

      - name: Build
        run: hugo --minify 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
